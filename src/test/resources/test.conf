isenguard.limit.test {
    interval = 1m
    limit = 5
}

isenguard.limit.security {
    interval = 1m
    limit = 3
    type = "ip"
}

async {
    distributed {
        queues {
            fifo-test {
                concurrencyToken = test
            }
            prioritized-test {
                concurrencyToken = test
                prioritized = true
                penaltyTime = 10 seconds
            }
        }

        concurrency {
            test = 1
        }
    }
}

storage.sharedSecret = "storage-test-secret"

security.saml.maxEncodedResponseSize = 64
security.saml.maxResponseAcceptanceDuration = 5 minutes

storage.buckets.versioned-files.maxNumberOfVersions = 2

storage {
    layer1 {
        replication {
            replicateDeleteDelay = 5s
            replicateUpdateDelay = 5s
            retryReplicationDelay = 10s
        }
        spaces {
            fs-test {
                engine = "fs"
            }

            fs-zip-test {
                engine = "fs"
                compression = "default"
            }

            fs-aes-test {
                engine = "fs"
                cipher = "aes256"
                passphrase = "test"
            }

            fs-zip-aes-test {
                engine = "fs"
                compression = "default"
                cipher = "aes256"
                passphrase = "test"
            }

            s3-test {
                engine = "s3"
            }

            s3-zip-test {
                engine = "s3"
                 compression = "default"
            }

            s3-aes-test {
                engine = "s3"
                cipher = "aes256"
                passphrase = "test"
            }

            s3-zip-aes-test {
                engine = "s3"
                compression = "default"
                cipher = "aes256"
                passphrase = "test"
            }

            repl-primary {
                engine = "fs"
                replicationSpace = "reply-secondary"
            }

            reply-secondary {
                engine = "s3"
            }
            blob-files {}
        }
    }
    layer2.spaces {
        blob-files {
                readPermission = "disabled"
        }
    }

}

security {

    profiles {
        upgradeA {
            permission1: true
            permission2: true
        }

        packageBasic {
            permission3: true
        }
    }

    packages {
        test-scope-1 {
            packages = ["package1", "package2"]
            upgrades = ["upgradeA", "upgradeB", "upgradeC"]
        }

        test-scope-2 {
            packages = ["package3"]
            upgrades = ["upgradeD", "upgradeE"]
        }

        required-permissions-for-permission {
            role1a = "permission1"
            role1b = "permission1"
        }
    }
}

code-lists {
    hard-test {
        autofill = false
    }
}

orchestration {
    loop-TestLoop = CLUSTER
}

lookup-tables {
    test-extension-table {
        codeCase = "lower"
        data {
            test {
                name = "$Model.name"
                description {
                    de = "Die beste Beschreibung"
                    sv = "Den bästa beskrivningen"
                }
            }
        }
    }

    # Provide config based data for the salutations so that PersonData can be tested
    # without requiring a populated code list.
    salutations {
        codeList = ""
        data {
            SIR {
                name {
                    en = "Sir"
                    de = "Herr"
                }
            }
            MADAM {
                name {
                    en = "Madam"
                    de = "Frau"
                }
            }
        }
    }

    # Provide config based data for the countries (used for ZIP validation) so that
    # InternationalAddressData can be tested without requiring a populated code list.
    countries {
        codeList = ""
        codeCase = "lower"
        data {
            de {
                name {
                    en = "Germany"
                    de = "Deutschland"
                }
                zipCodeRegEx = "\\d{5}"
            }
            at {
                name {
                    en = "Austria"
                    de = "Österreich"
                }
                zipCodeRegEx = "\\d{4}"
            }
        }
    }

    # Provide config based data for the active countries (used by the country lookup value).
    active-countries {
        codeList = ""
        codeCase = "lower"
        data {
            de {
                name {
                    en = "Germany"
                    de = "Deutschland"
                }
            }
            at {
                name {
                    en = "Austria"
                    de = "Österreich"
                }
            }
        }
    }
}

jupiter {
    # We already push a config via docker-compose to speed up testing.
    # (we'd otherwise have to wait for the new config to be applied etc.)
    automaticUpdate = false
}

# Enables both JWT setups so that JwtsTest can cover either verification path. The MAC signer requires at least
# 32 bytes, hence the repetition. As jwksPemFiles is filled, JWTs are signed with the key, not the secret.
security.jwt.sharedSecret = "TEST-TEST-TEST-TEST-TEST-TEST-TEST"
# JwtsTest generates these key pairs before its first assertion - Jwts parses the files lazily. Two keys of
# different types are used so that a verifier which cannot handle the algorithm of a token is covered as well.
security.jwt.jwksPemFiles = "target/jwt-test-keys/rsa.pem;target/jwt-test-keys/ec.pem"
